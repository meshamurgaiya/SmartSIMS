<!DOCTYPE html>
<html>

<head>

    <title>Change Password</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        body{
            background:#f4f6f9;
            font-family:Arial,sans-serif;
        }

        .container{
            width:450px;
            margin:60px auto;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,.15);
        }

        h2{
            text-align:center;
            color:#dc3545;
        }

        label{
            font-weight:bold;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:5px;
            margin-bottom:15px;
            border-radius:8px;
            border:1px solid #ccc;
            font-size:16px;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            font-size:17px;
            cursor:pointer;
            color:white;
        }

        .save{
            background:#198754;
        }

        .back{
            background:#0d6efd;
            margin-top:10px;
        }

    </style>

</head>

<body>

<div class="container">

<h2>🔑 Change Password</h2>

<form>

<label>Current Password</label>

<input
type="password"
placeholder="Enter Current Password">

<label>New Password</label>

<input
type="password"
placeholder="Enter New Password">

<label>Confirm Password</label>

<input
type="password"
placeholder="Confirm New Password">

<button class="save">
Update Password
</button>

</form>

<a href="/dashboard">

<button class="back">

⬅ Back to Dashboard

</button>

</a>

</div>

</body>

</html>
